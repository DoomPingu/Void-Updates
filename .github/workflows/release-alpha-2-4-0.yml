name: Build and publish Void Alpha 2.4.0

on:
  push:
    branches:
      - main
    paths:
      - "release_build/**"
      - ".github/workflows/release-alpha-2-4-0.yml"

permissions:
  contents: write

env:
  RELEASE_TAG: v2.4.0
  RELEASE_NAME: Alpha 2.4.0
  ASSET_NAME: Void_alpha_2.4.0.zip

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct release sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_src | Out-Null

          $voidParts = Get-ChildItem "release_build/void_parts/part_*.txt" | Sort-Object Name
          $voidText = ($voidParts | ForEach-Object {
              Get-Content $_.FullName -Raw
          }) -join "`n"

          [System.IO.File]::WriteAllText(
              (Join-Path $PWD "build_src/void.py"),
              $voidText,
              [System.Text.UTF8Encoding]::new($false)
          )

          $kampfParts = Get-ChildItem "release_build/kampfsystem_parts/part_*.txt" | Sort-Object Name
          $kampfText = ($kampfParts | ForEach-Object {
              Get-Content $_.FullName -Raw
          }) -join "`n"

          [System.IO.File]::WriteAllText(
              (Join-Path $PWD "build_src/kampfsystem.py"),
              $kampfText,
              [System.Text.UTF8Encoding]::new($false)
          )

          Copy-Item "release_build/void_version.json" "build_src/void_version.json"

          $voidLines = (Get-Content "build_src/void.py").Count
          $kampfLines = (Get-Content "build_src/kampfsystem.py").Count

          if ($voidLines -ne 28290) {
              throw "Void source line count mismatch: $voidLines"
          }

          if ($kampfLines -ne 2740) {
              throw "Combat source line count mismatch: $kampfLines"
          }

      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile build_src/void.py build_src/kampfsystem.py

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name Void --paths build_src build_src/void.py

      - name: Package release
        shell: pwsh
        run: |
          Copy-Item "build_src/void_version.json" "dist/void_version.json"

          Compress-Archive -Force `
            -Path "dist/Void.exe","dist/void_version.json" `
            -DestinationPath $env:ASSET_NAME

          $hash = (Get-FileHash $env:ASSET_NAME -Algorithm SHA256).Hash
          "ZIP SHA256: $hash"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null

          if ($LASTEXITCODE -eq 0) {
              gh release upload `
                $env:RELEASE_TAG `
                $env:ASSET_NAME `
                --repo $env:GITHUB_REPOSITORY `
                --clobber
          }
          else {
              gh release create `
                $env:RELEASE_TAG `
                $env:ASSET_NAME `
                --repo $env:GITHUB_REPOSITORY `
                --target $env:GITHUB_SHA `
                --title $env:RELEASE_NAME `
                --notes-file "release_build/release_notes.md"
          }

          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release publication failed."
          }

      - name: Update online version metadata
        shell: pwsh
        run: |
          $hash = (Get-FileHash $env:ASSET_NAME -Algorithm SHA256).Hash

          $online = Get-Content "void_online_version.json" -Raw | ConvertFrom-Json

          $online.version = "2.4.0"
          $online.name = "Alpha 2.4.0"
          $online.sha256 = $hash
          $online.download_url = "https://github.com/DoomPingu/Void-Updates/releases/download/v2.4.0/Void_alpha_2.4.0.zip"
          $online.patch_notes = @(
              "Drei getrennte Speicherplätze mit sicherer Slot-Auswahl und Import alter Spielstände",
              "Speichern/Laden und Hauptmenü-Verhalten für die neuen Speicherplätze überarbeitet",
              "Globale Menü-Tasten im verlassenen Dorf ergänzt",
              "Dorfbrunnen-Lore bleibt bei Wiederholungen lesbar; Entwickler-Easter-Egg erscheint zusätzlich",
              "Laufende Reisen können mitten auf dem Weg umgekehrt werden",
              "Neues Reise-Kampfsystem mit streckenspezifischen Kampfchancen, Cooldown und Pechschutz",
              "Der ruhige Prolog bleibt auf dem Weg zur Köhlerei kampffrei",
              "Feste Reiseereignisse haben Vorrang vor zufälligen Kampfbegegnungen"
          )

          $json = $online | ConvertTo-Json -Depth 20

          [System.IO.File]::WriteAllText(
              (Join-Path $PWD "void_online_version.json"),
              $json + "`n",
              [System.Text.UTF8Encoding]::new($false)
          )

      - name: Commit updater metadata
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add void_online_version.json

          if (git diff --cached --quiet) {
              "No updater metadata changes to commit."
              exit 0
          }

          git commit -m "Publish Alpha 2.4.0 metadata"
          git push
